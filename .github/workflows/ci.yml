# Draft for .github/workflows/ci.yml
#
# WHY A SECOND WORKFLOW: .forgejo/workflows/ci.yml is deliberately built from `run:` steps only,
# because the self-hosted Forgejo runner sits on act + Docker 29.7.0, where copying any `uses:`
# action into the job container fails. That constraint is specific to that runner. GitHub-hosted
# runners have none of it, so this file uses normal actions and is far shorter.
#
# Keep both. They are not duplicates: they target different runners with different limitations.
# If the build steps change, change them in both.

name: CI

# NOTE: `main` here is upstream Sterna, not this fork. The fork's work lands on
# gridlink-* branches, which is also what the repo's default branch points at, so building only
# `main` would mean CI never once ran against a Gridlink commit.
on:
  push:
    branches: [main, 'gridlink-**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The hosted image ships an Android SDK, but not necessarily platform 36 /
      # build-tools 36.0.0, which this project pins. Install them explicitly.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # 🔴 Every module that has tests, listed by name. CI used to run :core:jmap alone, which is
      # 12 of the 161 test files in the tree: the other 149, covering the whole cache, sync, IMAP
      # and UI-mapping surface, were green only on whichever machine last bothered, which is the
      # same as not having them. Listed explicitly rather than as a bare `test` so this file says
      # what is covered, and so a new module with tests has to be added here deliberately instead
      # of being quietly picked up or quietly missed. One step, so any failure fails the run.
      - name: Unit tests
        run: >-
          ./gradlew
          :core:jmap:test :core:imap:test :core:dav:test
          :core:data:testDebugUnitTest :app:testDebugUnitTest
          --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gridlink-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Feeds the resolved dependency list to GitHub's dependency graph, which is what makes Dependabot
  # security alerts fire for a Gradle project — without it the graph is guessed from build files and
  # misses everything resolved transitively, which is where a vulnerable transitive dependency lives
  # by definition. Paired with .github/dependabot.yml; neither is much use alone.
  #
  # Its own job, not a step in `build`: it resolves configurations rather than building, so a
  # compile failure should not suppress the security signal, and a submission failure should not
  # fail the APK.
  dependency-graph:
    runs-on: ubuntu-latest
    # Only from a push to this repository. A pull_request run from a fork gets a read-only token and
    # cannot submit, which would be a permanent red X on every external PR for no benefit.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v4
