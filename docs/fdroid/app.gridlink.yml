# F-Droid build metadata for Gridlink Mail.
#
# This is the file that goes into fdroiddata as metadata/app.gridlink.yml. It lives here
# so it is versioned with the app it describes: a versionCode bump or a Gradle change has
# to be reflected here, and a copy sitting only in a merge request gets forgotten.
Categories:
  - Internet
License: GPL-3.0-only
AuthorName: tatelink
SourceCode: https://github.com/tatelink/gridlink-mail
IssueTracker: https://github.com/tatelink/gridlink-mail/issues
Changelog: https://github.com/tatelink/gridlink-mail/blob/HEAD/CHANGELOG.md

AutoName: Gridlink Mail

RepoType: git
Repo: https://github.com/tatelink/gridlink-mail.git

Builds:
  - versionName: 0.1.0
    versionCode: 1000
    commit: v0.1.0
    subdir: app
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0
CurrentVersionCode: 1000
