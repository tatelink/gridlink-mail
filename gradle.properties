# Project-wide Gradle settings (non-secret only — proxy/credentials live in ~/.gradle/gradle.properties).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# AGP 9 opt-outs: keep the Kotlin plugin and the classic DSL until these are migrated on their own.
android.builtInKotlin=false
android.newDsl=false
android.onlyEnableUnitTestForTheTestedBuildType=false
