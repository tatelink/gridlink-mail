name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runs on a self-hosted Forgejo runner (see ci/README.md). The runner maps the
# `docker` label to catthehacker/ubuntu:act-22.04. Only actions/checkout is used
# (Codeberg mirrors it); the Android SDK installs via plain shell. Steps are split
# and verbose (set -eux) so any failure is obvious in the run log.
jobs:
  build:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip curl ca-certificates
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Download Android command-line tools
        run: |
          set -eux
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fSL --retry 3 -o /tmp/cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          ls -l /tmp/cmdtools.zip
          file /tmp/cmdtools.zip || true
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Install SDK packages
        run: |
          set -eux
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` gets SIGPIPE (141) when sdkmanager exits; under bash pipefail that
          # would abort the step even though licenses are accepted, so swallow it.
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew :core:jmap:test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
