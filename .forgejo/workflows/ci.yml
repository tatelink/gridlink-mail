name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runs on a self-hosted Forgejo runner (see ci/README.md). The runner maps the
# `docker` label to catthehacker/ubuntu:act-22.04. The Android SDK installs via
# plain shell. Steps are split and verbose (set -eux) so any failure is obvious
# in the run log.
#
# NO `uses:` STEPS, DELIBERATELY — the checkout is done by hand below. To run an
# action, the runner copies it into the job container, and Docker 29.7.0 stopped
# creating the destination's missing parent directories on that copy: every
# `docker cp src=... dst=/var/run/act/actions/<hash>/` now fails with "Could not
# find the file", so ANY action fails the job before it starts. Reproduced on the
# host, and upgrading the runner (6.3.1 -> 12.13.2) does not help; it is act's
# copy that assumes the old behaviour. A workflow made only of `run:` steps has
# nothing to copy, so it is immune. This also drops the dependency on
# data.forgejo.org, whose month-old cached clone of the action had itself gone
# stale when the upstream `v4` tag moved.
jobs:
  build:
    runs-on: docker
    steps:
      # Hand-rolled equivalent of actions/checkout@v4, see the note above. The
      # repository is public, so no credentials are needed; depth 1 because the
      # build never reads history. GITHUB_REF is the pushed branch (or the PR
      # merge ref), which is what the run is meant to build.
      - name: Checkout
        run: |
          set -eux
          git --version
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          git log -1 --format='%H %s'

      - name: Install JDK 17
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip curl ca-certificates
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Download Android command-line tools
        run: |
          set -eux
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fSL --retry 3 -o /tmp/cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          ls -l /tmp/cmdtools.zip
          file /tmp/cmdtools.zip || true
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Install SDK packages
        run: |
          set -eux
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` gets SIGPIPE (141) when sdkmanager exits; under bash pipefail that
          # would abort the step even though licenses are accepted, so swallow it.
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew :core:jmap:test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
