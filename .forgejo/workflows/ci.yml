name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runs on a self-hosted Forgejo runner (see ci/README.md). The runner maps the
# `docker` label to an image with apt/curl/node (e.g. catthehacker/ubuntu:act-22.04).
# Only actions/checkout is used (Codeberg mirrors it); the Android SDK is installed
# with plain shell so we don't depend on third-party actions being mirrored.
jobs:
  build:
    runs-on: docker
    env:
      ANDROID_SDK_VERSION: "13114758"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17 + Android SDK
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip curl ca-certificates
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_VERSION}_latest.zip"
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :core:jmap:test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
