# Self-hosted Forgejo Actions runner for Jmail CI.
# Run this on an always-on server with Docker. See README.md in this folder.
#
#   1. Codeberg → repo Settings → Actions → Runners → "Create new runner",
#      copy the registration token.
#   2. RUNNER_TOKEN=<token> docker compose up -d
#
services:
  runner:
    image: code.forgejo.org/forgejo/runner:6.3.1
    restart: always
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    user: "0:0"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cd /data
        if [ ! -f .runner ]; then
          forgejo-runner register --no-interactive \
            --instance https://codeberg.org \
            --token "$${RUNNER_TOKEN}" \
            --name "jmail-ci" \
            --labels "docker:docker://catthehacker/ubuntu:act-22.04"
        fi
        exec forgejo-runner daemon
    environment:
      RUNNER_TOKEN: "${RUNNER_TOKEN:-}"
