# Robolectric defaults for the Compose screen tests in src/test.
#
# sdk: compileSdk is 36; pin the emulated framework to the newest level this Robolectric release
# ships so a compileSdk bump never silently turns the whole screen suite red.
sdk=35
# application: a plain Application, NOT app.gridlink.GridlinkApplication. The screens under test
# are pure composables fed by parameters; they must not need the AppContainer (Room, WorkManager,
# account store), and running the real onCreate here would both slow every test and hide the day a
# screen grows a hidden dependency on it. A test that needs the container should say so with its
# own @Config and explain why.
application=android.app.Application
# qualifiers: a phone-sized window. Robolectric's default is a small legacy display, and on it
# the setup form's lower rows fall outside the viewport: their bounds come back clipped (every
# off-screen row reports the same top) and a tap aimed at them lands on nothing. Screen tests that
# still need a row below the fold call performScrollTo() first rather than assuming.
qualifiers=w412dp-h915dp-xxhdpi
